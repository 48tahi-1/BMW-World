
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW Gallery | BMW World</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body { background:#10080c; color:#f5eee9; }
        .gallery-hero {
            padding:100px 20px;
            text-align:center;
            background:linear-gradient(120deg,#210710,#390b18,#10080c);
        }
        .gallery-hero h1 {
            color:#d5b16a;
            font-size:clamp(38px,6vw,65px);
            font-weight:800;
            letter-spacing:3px;
        }
        .gallery-hero p { color:#e8dcca; }
        .gallery-filters { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; }
        .gallery-filter {
            border:1px solid #c9a45c;
            background:transparent;
            color:#d5b16a;
            padding:10px 20px;
            border-radius:30px;
        }
        .gallery-filter.active,.gallery-filter:hover {
            background:#c9a45c;
            color:#210710;
        }
        .gallery-card {
            background:#1c1015;
            border:1px solid #49303a;
            border-radius:12px;
            overflow:hidden;
            height:100%;
            cursor:pointer;
            transition:.3s;
        }
        .gallery-card:hover { transform:translateY(-6px); border-color:#c9a45c; }
        .gallery-card img {
            width:100%;
            height:230px;
            object-fit:cover;
            background:#210710;
        }
        .gallery-caption { padding:16px; color:#d5b16a; }
        .gallery-caption p { color:#bbaeb1; margin:5px 0 0; font-size:14px; }
        .gallery-empty { color:#c9a45c; text-align:center; padding:45px 10px; }
        .preview-modal {
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.92);
            z-index:2000;
            display:none;
            align-items:center;
            justify-content:center;
            padding:25px;
        }
        .preview-modal.show { display:flex; }
        .preview-modal img { max-width:90%; max-height:82vh; object-fit:contain; }
        .preview-close {
            position:absolute;
            top:20px;
            right:30px;
            color:white;
            font-size:35px;
            background:none;
            border:0;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background:#210710;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html" style="color:#d5b16a;">BMW WORLD</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="models.html">Models</a></li>
                <li class="nav-item"><a class="nav-link" href="compare.html">Compare</a></li>
                <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="gallery-hero">
    <h1>BMW GALLERY</h1>
    <p>Explore the design, performance and spirit of BMW.</p>
</section>

<section class="container py-5">
    <div class="gallery-filters mb-5">
        <button class="gallery-filter active" data-query="BMW car">All</button>
        <button class="gallery-filter" data-query="BMW M3 M4 M5">M Series</button>
        <button class="gallery-filter" data-query="BMW X5 X7 SUV">X Series</button>
        <button class="gallery-filter" data-query="BMW 3 Series 5 Series 7 Series sedan">Sedan</button>
        <button class="gallery-filter" data-query="BMW i4 iX i7 electric car">Electric</button>
        <button class="gallery-filter" data-query="BMW Z4 sports car">Sports</button>
    </div>

    <div class="row g-4" id="galleryContainer">
        <div class="col-12 gallery-empty">Loading BMW photographs...</div>
    </div>
</section>

<div class="preview-modal" id="previewModal">
    <button class="preview-close" id="closePreview">&times;</button>
    <img id="previewImage" alt="BMW gallery preview">
</div>

<footer class="text-center py-4" style="background:#210710;color:#c9a45c;">
    BMW WORLD | THE ART OF DRIVING
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
